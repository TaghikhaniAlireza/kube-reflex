version: 1

behaviors:
- id: reconnaissance
  mitre: TA0043
  name: Reconnaissance
  description: >
    Adversaries gather information they can use to plan future operations.
    This includes identifying victim infrastructure, identities, networks,
    organizations, and security posture through active and passive techniques.
  severity_weight: 3

  techniques:
    - id: T1595
      name: Active Scanning
      sub_techniques:
        - id: T1595.001  # Scanning IP Blocks
        - id: T1595.002  # Vulnerability Scanning
        - id: T1595.003  # Wordlist Scanning

    - id: T1592
      name: Gather Victim Host Information
      sub_techniques:
        - id: T1592.001  # Hardware
        - id: T1592.002  # Software
        - id: T1592.003  # Firmware
        - id: T1592.004  # Client Configurations

    - id: T1589
      name: Gather Victim Identity Information
      sub_techniques:
        - id: T1589.001  # Credentials
        - id: T1589.002  # Email Addresses
        - id: T1589.003  # Employee Names

    - id: T1590
      name: Gather Victim Network Information
      sub_techniques:
