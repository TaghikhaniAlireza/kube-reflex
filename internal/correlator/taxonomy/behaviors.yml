        - id: T1591.003  # Organizational Roles
        - id: T1591.004  # Decision Makers

    - id: T1598
      name: Phishing for Information
      sub_techniques:
        - id: T1598.001  # Spearphishing Service
        - id: T1598.002  # Spearphishing Attachment
        - id: T1598.003  # Spearphishing Link
        - id: T1598.004  # Voice Phishing

    - id: T1597
      name: Search Closed Sources
      sub_techniques:
        - id: T1597.001  # Search Threat Vendor Data
        - id: T1597.002  # Purchase Technical Data

    - id: T1596
      name: Search Open Technical Databases
      sub_techniques:
