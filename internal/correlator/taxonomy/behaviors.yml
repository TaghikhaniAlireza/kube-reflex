        - id: T1590.002  # DNS
        - id: T1590.003  # Network Trust Dependencies
        - id: T1590.004  # IP Addresses
        - id: T1590.005  # Network Security Appliances
        - id: T1590.006  # Network Topology

    - id: T1591
      name: Gather Victim Org Information
      sub_techniques:
