services:
  k8s-dev:
    build: .
    container_name: kube-reflex-dev
    volumes:
      - .:/app
      - ~/.kube/config:/root/.kube/config
    ports:
      - "8080:8080"
    environment:
      - KUBECONFIG=/root/.kube/config
      - DATABASE_URL=postgres://kubereflex:kubereflex@timescaledb:5432/kubereflex?sslmode=disable
    depends_on:
      - timescaledb
    command: sleep infinity

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: kube-reflex-db
    environment:
      POSTGRES_USER: kubereflex
      POSTGRES_PASSWORD: kubereflex
      POSTGRES_DB: kubereflex
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data: