apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-reflex
  labels:
    app: kube-reflex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-reflex
  labels:
    app: kube-reflex
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-reflex
  labels:
    app: kube-reflex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-reflex
subjects:
  - kind: ServiceAccount
    name: kube-reflex
    namespace: default
