apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-reflex
  labels:
    app: kube-reflex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-reflex
  template:
    metadata:
      labels:
        app: kube-reflex
    spec:
      # ServiceAccount for in-cluster K8s API (pod/namespace resolution). Create via k8s/rbac.yaml.
      serviceAccountName: kube-reflex
      containers:
        - name: brain
          image: kube-reflex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kube-reflex-secrets
                  key: database-url
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: kube-reflex-config
                  key: redis-addr
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Optional: mount ConfigMaps to override config files (default: baked into image)
          # volumeMounts:
          #   - name: chains-config
          #     mountPath: /app/internal/correlator/rules/chains.yml
          #     subPath: chains.yml
          #   - name: behaviors-config
          #     mountPath: /app/internal/correlator/taxonomy/behaviors.yml
          #     subPath: behaviors.yml
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      # volumes:
      #   - name: chains-config
      #     configMap:
      #       name: kube-reflex-chains
      #   - name: behaviors-config
      #     configMap:
      #       name: kube-reflex-behaviors
